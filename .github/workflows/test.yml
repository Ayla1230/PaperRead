# 每次推送和 PR：在 Windows / Linux 上安裝一次、執行單元測試，並實際啟動服務確認頁面可以開啟；手動執行時加測 macOS。
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 手動執行時才連 macOS 一起測（GitHub 的 Mac 機器少，平常推送不占，留給發佈建置）

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      EASYREAD_LIBRARY: ${{ github.workspace }}/ci-library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安裝（非 editable，順便檢查網頁檔案已打包）
        run: python -m pip install .
      - name: 單元測試
        # 失敗時把每個失敗的測試和錯誤訊息寫成 annotation，不用下載整份 log 也看得到
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee unittest.log || {
            python .github/annotate_unittest.py unittest.log
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 桌面、原頁與筆記儲存
        run: node --test tests/test_*.cjs
      - name: 啟動服務，開啟文獻庫頁面
        run: |
          cd "$RUNNER_TEMP"
          python -m easyread serve --port 8799 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/ -o page.html && break; sleep 1; done
          cat serve.log
          grep -q "PaperRead" page.html
          curl -sf http://127.0.0.1:8799/web/js/common/confirm.js -o /dev/null
          curl -sf http://127.0.0.1:8799/web/css/base.css -o /dev/null
          echo OK

  start-sh:
    # macOS / Linux 的一鍵啟動指令碼
    strategy:
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ./start.sh
        run: |
          export EASYREAD_LIBRARY="$RUNNER_TEMP/lib"
          (./start.sh > start.log 2>&1 &)
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          cat start.log
          curl -sf http://127.0.0.1:8765/ | grep -q "PaperRead"
