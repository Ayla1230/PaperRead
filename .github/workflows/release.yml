name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install backend build tools and dependencies
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build and package
        run: npm run dist
      - name: Smoke test the frozen backend
        run: python scripts/smoke_backend.py
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperread-${{ matrix.name }}
          # Each runner contributes only its own desktop artifacts.
          path: |
            dist/electron/*.exe
            dist/electron/*.blockmap
            dist/electron/latest*.yml
            dist/electron/*.AppImage
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.blockmap
            release-assets/**/latest*.yml
            release-assets/**/*.AppImage
          generate_release_notes: false
          body: |
            ## PaperRead ${{ github.ref_name }}

            Windows x64 installer and Linux x64 AppImage are attached to this release.

            Docker browser edition:

            ```bash
            docker pull ghcr.io/yuriylin/paperread:${{ github.ref_name }}
            docker run -d --name paperread --restart unless-stopped -p 8765:8765 -v paperread-data:/data/PaperRead ghcr.io/yuriylin/paperread:${{ github.ref_name }}
            ```

            Open http://localhost:8765 after the container starts.
